# Single-UART board: move the console/log off uart0 (onto SEGGER RTT) so uart0
# is free to be the device-under-test. RTT is read on the host over the XDS110
# probe via openocd (no J-Link required).

CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y

# Default up-buffer (1024) truncates a full ztest run when captured by dumping the ring buffer
# (openocd 'rtt server' skips pre-existing data). 8 KB holds the whole uart_async_api output
# incl. the final summary. RAM budget: board has 36 KB; baseline image used ~18 KB.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
