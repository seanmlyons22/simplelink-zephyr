# CC23x0 memory-to-memory transfers use the software event channels (ECH),
# channels 6 and 7 (TRM uDMA chapter: software requests on the ECH channels).
CONFIG_DMA_TRANSFER_CHANNEL_NR_0=6
CONFIG_DMA_TRANSFER_CHANNEL_NR_1=7

# Console/log on SEGGER RTT so results can be read over the XDS110 probe
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

# Keep the test deterministic: standby would power down the SVT domain
# (event routing, DMA state) between operations
CONFIG_PM=n
