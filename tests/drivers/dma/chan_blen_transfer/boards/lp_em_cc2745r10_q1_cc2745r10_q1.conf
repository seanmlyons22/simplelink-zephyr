# CC27xx memory-to-memory transfers use the software event channels (ECH),
# channels 8 to 11 (TRM uDMA chapter: software requests on the ECH channels).
CONFIG_DMA_TRANSFER_CHANNEL_NR_0=8
CONFIG_DMA_TRANSFER_CHANNEL_NR_1=9

# Console/log on SEGGER RTT so results can be read over the debug probe
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
