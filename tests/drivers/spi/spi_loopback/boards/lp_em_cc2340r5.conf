CONFIG_SPI_LOOPBACK_MODE_LOOP=y

# Console/log on SEGGER RTT so results can be read over the XDS110 probe
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y
# 36 KB SRAM: the suite's two 8 KB "large" DMA buffers dominate RAM, so keep
# the RTT up-buffer small (default is 1 KB) - the host drains it continuously.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048

# Keep the test deterministic: standby would power down the SVT domain
# (event routing, DMA state) between operations
CONFIG_PM=n
