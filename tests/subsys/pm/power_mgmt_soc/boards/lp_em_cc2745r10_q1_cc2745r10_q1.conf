# Console/log on SEGGER RTT (read over the XDS110 debug probe): RTT is
# RAM-based so it survives standby, while the UART console is suspended by
# system-managed device PM around each standby cycle.
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
