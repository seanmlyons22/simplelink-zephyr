# The sample disables the console (uart0 is the HCI transport). Re-enable it on
# SEGGER RTT to observe a clean boot (BT controller init, no fault) over XDS110.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=512
CONFIG_BOOT_BANNER=y

# Sample defaults to BT_MAX_CONN=16; trim to fit the cc2340R5 36KB SRAM.
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BUF_ACL_RX_COUNT=6
CONFIG_BT_BUF_ACL_TX_COUNT=3
