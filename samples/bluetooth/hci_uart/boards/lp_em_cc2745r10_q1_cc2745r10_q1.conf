# The sample disables the console (uart0 is the HCI transport). Re-enable it on
# SEGGER RTT to observe a clean boot (BT controller init, no fault) over XDS110.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024
CONFIG_BOOT_BANNER=y
