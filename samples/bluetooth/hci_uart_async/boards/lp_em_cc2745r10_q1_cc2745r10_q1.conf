# uart0 is the HCI transport, so move console/log to SEGGER RTT and observe a
# clean boot (BT controller init, no fault) over the XDS110 probe.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024
CONFIG_BOOT_BANNER=y

# The async HCI sample requires the poll subsystem.
CONFIG_POLL=y
